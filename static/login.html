<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chatly AI - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0c0d14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
/* Login-page-only layout — everything else (colors, splash, bubbles) comes
   from styles.css so this page feels like part of the same app. */
html, body { overflow: auto; }
#loginShell { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; background: radial-gradient(circle at 50% 15%, #1a1830 0%, #0c0d14 60%); }
.box { width:100%; max-width:390px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:34px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
.logo { width:64px; height:64px; border-radius:20px; background:linear-gradient(145deg,var(--accent),var(--accent-2)); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; box-shadow:0 0 30px rgba(124,108,240,.35); }
.logo svg { width:30px; height:30px; }
.box h1 { font-family: var(--font-display); font-weight:600; color:var(--text); text-align:center; font-size:22px; margin-bottom:6px; }
.subtitle { color:var(--text-dim); text-align:center; font-size:13.5px; margin-bottom:28px; }
.box input { width:100%; padding:13px 15px; border-radius:11px; border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none; font-size:15px; margin-bottom:12px; transition: border-color .15s ease, box-shadow .15s ease; }
.box input::placeholder { color:var(--text-faint); }
.box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,108,240,.18); }
.box button { width:100%; padding:13px; border-radius:11px; border:none; cursor:pointer; font-size:14.5px; font-weight:700; margin-bottom:10px; transition: filter .15s ease, transform .1s ease; }
.primary-btn { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 8px 20px rgba(124,108,240,.3); }
.primary-btn:hover { filter:brightness(1.08); }
.primary-btn:active { transform: scale(.98); }
.primary-btn:disabled { opacity:.55; cursor:not-allowed; }
.toggle-text { text-align:center; color:var(--text-dim); font-size:13px; margin-top:18px; }
.toggle-text span { color:var(--accent-2); cursor:pointer; font-weight:600; }
#message { text-align:center; font-size:13px; margin-bottom:12px; min-height:18px; }
#message.error { color:var(--danger); }
#message.success { color:var(--accent-2); }
@media (max-width:420px) { .box { padding:26px 22px; border-radius:16px; } .box h1 { font-size:20px; } .logo { width:56px; height:56px; } }
</style>
</head>
<body>

<!-- Same splash used on the main app: big logo + rising bubbles first,
     then it shrinks up and out of the way as the login card fades in. -->
<div id="splash">
  <div id="bubbleField"></div>
  <div class="splash-content">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4.7 3.5A.5.5 0 0 1 2.5 20V5a1 1 0 0 1 1-1z" fill="#151626"/>
        <circle cx="8.5" cy="10.5" r="1.3" fill="#ffffff"/>
        <circle cx="13" cy="10.5" r="1.3" fill="#ffffff"/>
        <circle cx="17.5" cy="10.5" r="1.3" fill="#ffffff"/>
      </svg>
    </div>
    <h1>Chatly AI</h1>
    <p class="tagline">Apka smart AI saathi</p>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="loginShell" class="reveal-after-splash">
  <div class="box">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4.7 3.5A.5.5 0 0 1 2.5 20V5a1 1 0 0 1 1-1z" fill="#151626"/>
        <circle cx="8.5" cy="10.5" r="1.3" fill="#ffffff"/>
        <circle cx="13" cy="10.5" r="1.3" fill="#ffffff"/>
        <circle cx="17.5" cy="10.5" r="1.3" fill="#ffffff"/>
      </svg>
    </div>
    <h1 id="formTitle">Welcome to Chatly AI</h1>
    <p class="subtitle" id="formSubtitle">Login to continue your conversations</p>

    <div id="message"></div>

    <input type="email" id="email" autocomplete="email" placeholder="Email address">
    <input type="password" id="password" autocomplete="current-password" placeholder="Password">
    <input type="password" id="confirmPassword" autocomplete="off" placeholder="Confirm password" style="display:none">

    <button class="primary-btn" id="submitBtn">Login</button>

    <p class="toggle-text" id="toggleText">
      Don't have an account? <span id="toggleLink">Sign up</span>
    </p>
  </div>
</div>

<script type="module">
  import { signUp, signIn, setSession, isLoggedIn } from "/static/auth.js";

  if (isLoggedIn()) window.location.href = "/";

  // ---- Splash bubbles + shrink-up transition into the login card ----
  function buildBubbles() {
    const field = document.getElementById("bubbleField");
    const count = window.innerWidth < 600 ? 14 : 22;
    for (let i = 0; i < count; i++) {
      const b = document.createElement("div");
      b.className = "bubble";
      const size = 14 + Math.random() * 46;
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = Math.random() * 100 + "%";
      b.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
      b.style.animationDuration = 5 + Math.random() * 5 + "s";
      b.style.animationDelay = Math.random() * 4 + "s";
      field.appendChild(b);
    }
  }
  buildBubbles();
  window.addEventListener("load", () => {
    setTimeout(() => {
      const splash = document.getElementById("splash");
      const shell = document.getElementById("loginShell");
      splash.classList.add("leaving");
      shell.classList.add("show");
      setTimeout(() => splash.classList.add("hide"), 500);
    }, 1600);
  });

  // ---- Login / signup form logic (unchanged behavior) ----
  let isLoginMode = true;

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");
  const submit = document.getElementById("submitBtn");
  const message = document.getElementById("message");
  const toggleText = document.getElementById("toggleText");
  const title = document.getElementById("formTitle");
  const subtitle = document.getElementById("formSubtitle");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type || "";
  }

  function updateMode() {
    isLoginMode = !isLoginMode;
    if (isLoginMode) {
      title.textContent = "Welcome to Chatly AI";
      subtitle.textContent = "Login to continue your conversations";
      submit.textContent = "Login";
      confirmPassword.style.display = "none";
      toggleText.innerHTML = 'Don\'t have an account? <span id="toggleLink">Sign up</span>';
    } else {
      title.textContent = "Create your account";
      subtitle.textContent = "Choose a password to start chatting";
      submit.textContent = "Sign Up";
      confirmPassword.style.display = "block";
      toggleText.innerHTML = 'Already have an account? <span id="toggleLink">Login</span>';
    }
    document.getElementById("toggleLink").onclick = updateMode;
    showMessage("", "");
  }
  document.getElementById("toggleLink").onclick = updateMode;

  [email, password, confirmPassword].forEach((el) => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submit.click();
      }
    });
  });

  submit.onclick = async () => {
    const e = email.value.trim();
    const p = password.value;
    const cp = confirmPassword.value;

    if (!e || !p) {
      showMessage("Please fill in all required fields.", "error");
      return;
    }
    if (!isLoginMode && p !== cp) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    submit.disabled = true;
    showMessage("Please wait...", "");

    
    if (isLoginMode) {
      const result = await signIn(e, p);
      if (result.success) {
        setSession(result.access_token, result.refresh_token, result.email);
        window.location.href = "/";
      } else {
        showMessage(result.error || "Login failed.", "error");
        submit.disabled = false;
      }
    } else {
      const result = await signUp(e, p);
      if (result.success) {
        if (result.needs_email_confirmation) {
          updateMode(); // switch back to login mode
          showMessage("Account created! Please check your email to confirm, then log in.", "success");
        } else {
          setSession(result.access_token, result.refresh_token, result.email);
          window.location.href = "/";
        }
      } else {
        showMessage(result.error || "Sign up failed.", "error");
      }
      submit.disabled = false;
    }
  };
</script>
</body>
</html>
